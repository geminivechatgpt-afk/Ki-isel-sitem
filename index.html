<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Web Sitem</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #00adb5; }
        p { color: #aaaaaa; }
        .btn {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Merhaba, Ben Sitem 👋</h1>
        <p>Yazılım geliştirmeye ve yeni teknolojiler keşfetmeye meraklı biriyim.</p>
        
        <h3>İlgi Alanlarım</h3>
        <p>💻 Kodlama | 🎮 Oyun | 📚 Bilim</p>

        <button class="btn" onclick="mesajGonder()">Bana Ulaş</button>
    </div>

    <script>
        function mesajGonder() {
            alert("Mesajın alındı! Harika gidiyorsun.");
        }
    </script>
</body>
</html>
